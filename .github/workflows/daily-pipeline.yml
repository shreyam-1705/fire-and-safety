name: Daily Fire & Safety Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Create Java Keystores from Secrets
        env:
          KAFKA_CA_PEM: ${{ secrets.KAFKA_CA_PEM }}
          KAFKA_SERVICE_CERT: ${{ secrets.KAFKA_SERVICE_CERT }}
          KAFKA_SERVICE_KEY: ${{ secrets.KAFKA_SERVICE_KEY }}
        run: |
          echo "$KAFKA_CA_PEM" > ca.pem
          echo "$KAFKA_SERVICE_CERT" > service.cert
          echo "$KAFKA_SERVICE_KEY" > service.key
          openssl pkcs12 -export -in service.cert -inkey service.key -out keystore.p12 -name kafka -password pass:changeit
          keytool -import -file ca.pem -alias CARoot -keystore truststore.jks -storepass changeit -noprompt

      - name: Run PySpark Medallion Pipeline (availableNow)
        env:
          KAFKA_URI: ${{ vars.KAFKA_URI }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
          HF_BUCKET_NAME: ${{ vars.HF_BUCKET_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/pipeline.py